<div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
  <div class="mb-8">
    <h1 class="text-subheading font-semibold text-primary-ink">Consent Records</h1>
    <p class="mt-1 text-caption text-mid-gray">Most recent 200 consent decisions submitted by visitors.</p>
  </div>

  <div class="mb-8 grid gap-4 sm:grid-cols-3">
    <app-card>
      <p class="text-caption text-mid-gray">Total Records</p>
      <p class="mt-1 text-heading-sm font-semibold text-primary-ink">{{ logs().length }}</p>
    </app-card>
    <app-card>
      <p class="text-caption text-mid-gray">Accepted</p>
      <p class="mt-1 text-heading-sm font-semibold text-primary-ink">{{ acceptedCount() }}</p>
    </app-card>
    <app-card>
      <p class="text-caption text-mid-gray">Declined</p>
      <p class="mt-1 text-heading-sm font-semibold text-brand-red">{{ declinedCount() }}</p>
    </app-card>
  </div>

  @if (errorMessage()) {
    <div class="mb-6">
      <app-alert tone="error">{{ errorMessage() }}</app-alert>
    </div>
  }

  @if (loading()) {
    <app-spinner></app-spinner>
  } @else {
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="sm:w-72">
        <app-input
          type="search"
          placeholder="Search by GUID or IP address"
          [value]="searchTerm()"
          (valueChange)="onSearchChange($event)"
        ></app-input>
      </div>

      <div class="flex items-center gap-2">
        <label for="status-filter" class="text-caption font-medium text-deep-gray">Status</label>
        <select
          id="status-filter"
          class="rounded-lg border border-hairline px-3 py-2 text-body-sm text-primary-ink focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red"
          [value]="statusFilter()"
          (change)="onStatusFilterChange($any($event.target).value)"
        >
          <option value="all">All</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
        </select>
      </div>
    </div>

    <app-table
      [columns]="columns"
      [rows]="pagedLogs()"
      emptyMessage="No consent decisions match your search."
    ></app-table>

    <div class="mt-4">
      <app-pagination
        [page]="currentPage()"
        [totalItems]="filteredLogs().length"
        [pageSize]="pageSize"
        (pageChange)="page.set($event)"
      ></app-pagination>
    </div>
  }
</div>
