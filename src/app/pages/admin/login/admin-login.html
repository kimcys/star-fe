<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-canvas px-4 py-16">
  <app-card class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <h1 class="text-body-lg font-semibold text-primary-ink">Admin Login</h1>
      <p class="mt-1 text-caption text-mid-gray">Sign in to view submitted consent records.</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-4">
        <app-alert tone="error">{{ errorMessage() }}</app-alert>
      </div>
    }

    <form (submit)="$event.preventDefault(); submit()">
      <div class="space-y-4">
        <app-form-field label="Username">
          <app-input
            type="text"
            name="username"
            autocomplete="username"
            [value]="username()"
            (valueChange)="username.set($event)"
          ></app-input>
        </app-form-field>

        <app-form-field label="Password">
          <app-input
            type="password"
            name="password"
            autocomplete="current-password"
            [value]="password()"
            (valueChange)="password.set($event)"
          ></app-input>
        </app-form-field>
      </div>

      <div class="mt-6">
        <app-button type="submit" variant="primary" [fullWidth]="true" [loading]="submitting()">
          Log in
        </app-button>
      </div>
    </form>
  </app-card>
</div>
