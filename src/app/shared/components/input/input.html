<input
  [type]="type()"
  [name]="name()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [value]="value()"
  [disabled]="disabled()"
  (input)="valueChange.emit($any($event.target).value)"
  class="w-full rounded-lg border border-hairline px-3 py-2 text-body-sm text-primary-ink focus:border-brand-red focus:outline-none focus:ring-1 focus:ring-brand-red disabled:cursor-not-allowed disabled:opacity-50"
/>
