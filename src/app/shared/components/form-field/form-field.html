<!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -- the control is projected via ng-content and implicitly associated by wrapping, which this rule can't see through -->
<label class="block">
  <span class="mb-1.5 block text-caption font-medium text-deep-gray">{{ label() }}</span>
  <ng-content></ng-content>
  @if (error()) {
    <span class="mt-1.5 block text-caption text-danger">{{ error() }}</span>
  }
</label>
