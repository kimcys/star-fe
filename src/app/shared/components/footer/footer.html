<footer class="bg-canvas">
  <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
    <div class="flex flex-col items-center justify-between gap-6 sm:flex-row">
      <app-logo heightClass="h-8"></app-logo>

      <ul class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-caption text-mid-gray">
        @for (link of links; track link.path) {
          <li><a [routerLink]="link.path" class="hover:text-link-blue">{{ link.label }}</a></li>
        }
      </ul>
    </div>

    <p class="mt-6 text-center text-micro text-mid-gray sm:text-left">
      &copy; {{ year }} Star Media Group Berhad. All rights reserved.
    </p>
  </div>
</footer>
