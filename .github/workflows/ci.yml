name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: nothing here needs to write to the repo,
# push packages, or comment on anything.
permissions:
  contents: read

jobs:
  test:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: End-to-end (against the real Docker stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout star-fe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: star-fe
      # star-be is a sibling repo, not a dependency published anywhere -
      # the E2E suite drives the real docker-compose stack (frontend +
      # PHP API + MySQL) exactly like a developer would locally, so it
      # needs star-be checked out next to star-fe just like the root
      # project's git submodule layout does.
      - name: Checkout star-be
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: kimcys/star-be
          path: star-be
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: star-fe/package-lock.json
      - working-directory: star-fe
        run: npm ci
      - working-directory: star-fe
        run: npx playwright install --with-deps chromium
      - working-directory: star-fe
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: star-fe/playwright-report/
          retention-days: 7

  docker:
    name: Build & scan image
    runs-on: ubuntu-latest
    # Only this job needs to publish a package, and only for the one step
    # below that's actually gated to real pushes to main - everything else
    # in this workflow stays read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      # Baked in at the very first build, not added later - what gets
      # scanned below must be exactly what gets pushed, not a
      # differently-built image that merely shares a tag with it.
      - run: |
          docker build \
            --build-arg API_BASE_URL=https://api.aimanhakimcy.com \
            -t star-fe:${{ github.sha }} .
      - name: Scan image for known-fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: star-fe:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only publish images built from a real, scanned commit on main -
      # never from a pull request (which could come from a fork with no
      # write access) and never from a branch that hasn't passed the scan
      # above yet, since this step only runs after it.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag star-fe:${{ github.sha }} ghcr.io/kimcys/star-fe:${{ github.sha }}
          docker tag star-fe:${{ github.sha }} ghcr.io/kimcys/star-fe:latest
          docker push ghcr.io/kimcys/star-fe:${{ github.sha }}
          docker push ghcr.io/kimcys/star-fe:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [test, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
    steps:
      # git pull picks up any change to deploy/ (Caddyfile, compose file)
      # committed since the server's last deploy; docker compose pull only
      # re-downloads the frontend image if ghcr.io actually has a newer
      # digest for :latest, so this is a no-op most of the time on that
      # front.
      - name: Deploy frontend to the droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: aimanhakimcy.com
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/star-media
            git pull --ff-only origin main
            git submodule update --init --recursive
            cd deploy
            docker compose -f docker-compose.production.yml --env-file .env.production pull frontend
            docker compose -f docker-compose.production.yml --env-file .env.production up -d frontend
            docker image prune -f

      - name: Confirm the site is actually up
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://aimanhakimcy.com/ > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "Site did not respond after deploy" >&2
          exit 1
