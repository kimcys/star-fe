server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Angular Router uses the HTML5 History API (no #hash), so any path
  # that doesn't match a real static file must still resolve to
  # index.html and let the client-side router take over — otherwise a
  # hard refresh on e.g. /about or /admin/dashboard 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted JS/CSS chunks are safe to cache aggressively;
  # index.html itself is intentionally left out so a new deploy is
  # picked up on the next visit instead of being served stale.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
